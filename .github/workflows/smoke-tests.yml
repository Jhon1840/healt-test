name: QA Smoke Tests

on:
  workflow_run:
    workflows: ["Deploy Stage"]
    types:
      - completed

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Tests
        run: npx playwright test --project=smoke
        env:
          LOGIN_URL: ${{ secrets.STAGE_URL }}
          LOGIN_EMAIL: ${{ secrets.TEST_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        # Tests ejecutados:
        # - auth.setup.spec.ts (Autenticación)
        # - 01-listings-create.seed.spec.ts (Crear listing)
        # - 02-listings-edit-validar-tipos.spec.ts (Editar listing)
        # - 09-listings-activar-cambiar-estado.spec.ts (Activar listing)
        # - 01-contactos-creacion-semilla.spec.ts (Crear contacto)
        # - 02-contactos-editar-nombre.spec.ts (Editar contacto)
        # - 01-global-search-acceso.spec.ts (Búsqueda global)
        # - 02-global-search-texto-simple.spec.ts (Búsqueda texto)
        # - smoke-chose-subscription.spec.ts (Pagos)

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            test-results/
            blob-report/
