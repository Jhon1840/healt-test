name: Playwright Availability Check

on:
  schedule:
    - cron: "0 * * * *" # every hour (UTC)
  workflow_dispatch: {}

jobs:
  run-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      BASE_URL: ${{ secrets.BASE_URL }}
      LOGIN_URL: ${{ secrets.LOGIN_URL }}
      AVAILABILITY_ENV: ${{ secrets.AVAILABILITY_ENV }}
      AVAILABILITY_URL: ${{ secrets.AVAILABILITY_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      WHATSAPP_URL: ${{ secrets.WHATSAPP_URL }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID }}
      ALERT_PHONES: ${{ secrets.ALERT_PHONES }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run availability check
        run: python check_availability.py
